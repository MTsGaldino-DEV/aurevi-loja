# Development services only. The port stays on localhost.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aurevi
      POSTGRES_PASSWORD: aurevi_dev
      POSTGRES_DB: aurevi
    ports: ['127.0.0.1:5433:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurevi']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
